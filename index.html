<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1f">
<title>b00mstick</title>
<meta name="description" content="NFL props model: first drive, punts, kicker points. Priced against DK, judged by CLV.">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta property="og:title" content="b00mstick">
<meta property="og:description" content="NFL props: first drive, punts, kicks.">
<meta property="og:image" content="assets/og-1200x630.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0a0e1f; --turf:#0e3b20; --turf2:#124a28; --chalk:#f2f0e4;
  --boom:#f88014; --cyan:#39d5ff; --gold:#ffd23f; --dim:#8b93a7;
  --card:#101830; --line:#243050; --red:#ff5a5a; --green:#5ad17a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--night);color:var(--chalk);font:14px/1.5 ui-monospace,'Cascadia Mono',Consolas,monospace;padding-bottom:76px}
.px{font-family:'Press Start 2P',monospace}
/* scoreboard header — fixed like the footer nav; body padding set by fitTop().
   Mobile: two rows (brand+buttons / chips). Desktop: one row. */
#topbar{position:fixed;top:0;left:0;right:0;z-index:45}
header{background:linear-gradient(180deg,var(--turf) 0%,var(--turf2) 100%);border-bottom:4px solid var(--boom);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.hrow1{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.hlogo{width:34px;height:34px}
.hword{height:20px;display:block}
.hbtns{display:flex;align-items:center;gap:8px;margin-left:auto}
.hbtns .chip{min-height:40px;display:inline-flex;align-items:center;padding:6px 10px}
.meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:10px;background:rgba(0,0,0,.35);border:1px solid var(--line);padding:3px 8px;border-radius:3px;color:var(--dim)}
#ovrBtn{background:var(--card);border:2px solid var(--gold);color:var(--gold);font-weight:700;letter-spacing:.5px;font-size:11px;padding:8px 12px;border-radius:4px;cursor:pointer;min-height:40px}
/* tabs */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#060a16;border-top:3px solid var(--boom);z-index:40}
nav button{flex:1;background:none;border:none;color:var(--dim);font-family:'Press Start 2P';font-size:9px;padding:16px 2px calc(16px + env(safe-area-inset-bottom));min-height:44px;cursor:pointer}
nav button.on{color:var(--boom);text-shadow:0 0 8px rgba(248,128,20,.6)}
main{max-width:760px;margin:0 auto;padding:12px}
.hidden{display:none!important}
/* cards */
.game{background:var(--card);border:2px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,var(--turf) 0%,var(--card) 100%);padding:8px 10px;border-bottom:2px solid var(--line);flex-wrap:wrap;cursor:pointer}
.gchev{color:var(--dim);font-size:11px;margin-left:4px;display:inline-block;transition:transform .15s}
.game.clp .gbody{display:none}
.game.clp .gchev{transform:rotate(-90deg)}
.game.clp .ghead{border-bottom:none}
.allctl{display:flex;justify-content:flex-end}
.allctl button{background:none;border:2px solid var(--line);color:var(--dim);font-weight:700;letter-spacing:.5px;font-size:10px;padding:8px 10px;border-radius:3px;cursor:pointer;min-height:40px;margin-bottom:12px}
.ghead .vs{font-size:11px}
.ghead .kick{color:var(--dim);font-size:11px;margin-left:auto}
.badge{font-size:9px;font-weight:700;letter-spacing:.5px;padding:2px 6px;border-radius:3px;border:1px solid}
.tlogo{vertical-align:middle;margin-right:2px}
.badge.wind{color:var(--cyan);border-color:var(--cyan)}
.badge.dome{color:var(--dim);border-color:var(--dim)}
.badge.newpc{color:var(--gold);border-color:var(--gold)}
.badge.ovr{color:var(--gold);border-color:var(--gold)}
/* plan tab */
.plan-h{font-family:'Press Start 2P';font-size:10px;color:var(--gold);margin-bottom:6px}
.ptog{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;background:none;border:none;cursor:pointer;padding:0;min-height:40px;text-align:left}
.plansec.clp .plan-body{display:none}
.plansec.clp .gchev{transform:rotate(-90deg)}
.plan-row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px;align-items:baseline}
.plan-row:last-child{border-bottom:none}
.plan-glyph{font-weight:700;font-size:12px}
.plan-glyph.done{color:var(--green)}
.plan-glyph.pend{color:var(--dim)}
.plan-date{color:var(--dim);font-size:10px;white-space:nowrap}
.plan-note{grid-column:2/4;color:var(--dim);font-size:11px}
.gbody{padding:10px;position:relative}
/* coach strip (DRIVE tab): away | home, chips match kicker mugshot framing */
.cstrip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.cchip{display:flex;gap:8px;align-items:center;margin-bottom:6px;min-width:0}
.cchip img,.cph{width:44px;height:44px;object-fit:cover;border:3px solid var(--gold);border-radius:6px;background:#0a1226;flex:0 0 auto}
.cph{display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.5px;font-size:15px;color:var(--gold)}
.cinfo{min-width:0}
.cname{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crole{font-size:9px;color:var(--dim);letter-spacing:.5px}
.ctag{font-weight:700;letter-spacing:.5px;font-size:9px;color:var(--gold);border:1px solid var(--gold);border-radius:3px;padding:2px 4px;display:inline-block;margin-top:3px}
/* drive rows */
.teamblock{margin-bottom:12px}
.tname{font-weight:700;letter-spacing:.5px;font-size:12px;color:var(--gold);margin-bottom:6px}
.orow{display:grid;grid-template-columns:52px 1fr 64px 74px 84px;gap:6px;align-items:center;margin-bottom:4px}
.olab{font-size:11px;color:var(--dim)}
.bar{height:14px;background:#0a1226;border:1px solid var(--line);border-radius:2px;position:relative}
.bar i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--turf2),var(--green));border-radius:1px}
.pct{font-size:11px;text-align:right}
input.odds,input.num{width:100%;background:#0a1226;border:1px solid var(--line);color:var(--chalk);padding:5px 6px;border-radius:3px;font:inherit;font-size:12px}
input:focus{outline:2px solid var(--cyan)}
.tier{font-weight:700;letter-spacing:.5px;font-size:11px;padding:5px 0;text-align:center;border-radius:3px;border:2px solid var(--line);color:var(--dim);cursor:pointer}
/* game has a logged bet for this tab's market */
.game.hasbet{border-color:var(--green)}
.game.hasbet .ghead::after{content:"✓ LOGGED";color:var(--green);font-weight:700;font-size:9px;letter-spacing:.5px;margin-left:6px}
.tier.BET{border-color:var(--boom);color:var(--boom);animation:blink 1.1s steps(2) infinite}
.tier.VALUE{border-color:var(--cyan);color:var(--cyan)}
@keyframes blink{50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){.tier.BET{animation:none}}
.mrow{display:grid;grid-template-columns:1fr 74px 74px 74px 84px 60px;gap:6px;align-items:center;margin:6px 0}
/* phones: the fixed mrow columns exceed a narrow card (PUNTS row, and the
   KICKS row inside .mug loses 64px more to the mugshot) — shrink them */
@media (max-width:767px){
  .mrow{grid-template-columns:minmax(0,1fr) 44px 44px 44px 52px 42px;gap:4px}
  .mug{gap:8px}
  .mug img{width:56px;height:56px}
  .mug .info{min-width:0}
}
.mrow .lab{font-size:11px;color:var(--dim)}
.logb{background:none;border:2px solid var(--green);color:var(--green);font-weight:700;letter-spacing:.5px;font-size:11px;padding:8px 6px;border-radius:3px;cursor:pointer;min-height:40px}
.small{font-size:11px;color:var(--dim)}
/* kicker / punter cards */
.mug{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.mug img{width:64px;height:64px;object-fit:cover;border:3px solid var(--gold);border-radius:6px;background:#0a1226;image-rendering:auto}
.mug .info{flex:1}
.mug .pname{font-weight:700;letter-spacing:.5px;font-size:13px}
.mug .proj{color:var(--gold);font-size:12px;margin:4px 0}
/* log */
.sumbar{display:flex;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px;flex-wrap:wrap}
.sumbar div{font-size:11px;color:var(--dim)}
.sumbar b{display:block;font-weight:700;letter-spacing:.5px;font-size:14px;color:var(--chalk);margin-top:4px}
.bet{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.bet .top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px}
.bet .clv{margin-left:auto;font-weight:700;letter-spacing:.5px;font-size:12px}
.clv.pos{color:var(--green)} .clv.neg{color:var(--red)}
.bet .closerow{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:6px;margin-top:8px;align-items:center}
.editrow{grid-template-columns:1fr 1fr auto auto!important}
.c4{grid-template-columns:repeat(4,1fr)!important}
.cbar{grid-template-columns:1fr auto auto!important;margin-top:6px!important}
.logb.del{border-color:var(--red);color:var(--red)}
.edtog{border-color:var(--dim);color:var(--dim)}
select{background:#0a1226;border:1px solid var(--line);color:var(--chalk);padding:5px;border-radius:3px;font:inherit;font-size:12px}
/* overlay */
#ovr{position:fixed;inset:0;background:rgba(4,6,14,.9);z-index:50;overflow:auto;padding:16px}
#ovr .panel{max-width:560px;margin:0 auto;background:var(--card);border:3px solid var(--gold);border-radius:8px;padding:14px}
.orow2{display:grid;grid-template-columns:80px 1fr auto;gap:6px;margin:6px 0;align-items:center}
h2.px{font-size:12px;margin-bottom:10px;color:var(--gold)}
.note{font-size:11px;color:var(--dim);margin:8px 0}
.err{color:var(--red);font-size:12px;padding:10px;text-align:center}
.loading{font-family:'Press Start 2P';font-size:10px;color:var(--dim);text-align:center;padding:40px 10px}
/* DK locator header per market tab */
.dkpath{background:var(--card);border:2px solid var(--line);border-left:4px solid var(--boom);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:11px;color:var(--chalk);line-height:1.6}
.dkpath b{color:var(--boom);font-weight:700;letter-spacing:.5px;margin-right:6px}
.dkpath .sep{color:var(--dim);margin:0 6px}
/* collapsible how-to strips */
.howto{background:var(--card);border:2px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.howto>button{width:100%;background:none;border:none;color:var(--gold);font-family:'Press Start 2P';font-size:9px;text-align:left;padding:13px 12px;cursor:pointer;min-height:40px}
.howto .body{display:none;padding:0 12px 12px;font-size:12px;line-height:1.6;color:var(--chalk)}
.howto.open .body{display:block}
/* ---------- desktop (mobile untouched below 1024px) ---------- */
@media (min-width:1024px){
  body{font-size:15px}
  main{max-width:1150px}
  header{display:flex;align-items:center;gap:14px}
  .hrow1{display:contents}
  .brand{order:1}
  .meta{order:2;margin:0 0 0 auto}
  .hbtns{order:3;margin-left:0}
  .hlogo{width:40px;height:40px}
  .hword{height:24px}
  #view-drive,#view-punts,#view-kicks{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  #view-drive:not(.hidden),#view-punts:not(.hidden),#view-kicks:not(.hidden){display:grid}
  #view-drive .game,#view-punts .game,#view-kicks .game{margin-bottom:0}
  #view-drive>.howto,#view-punts>.howto,#view-kicks>.howto,#view-drive>.err{grid-column:1/-1}
  #view-drive>.dkpath,#view-punts>.dkpath,#view-kicks>.dkpath{grid-column:1/-1}
  #view-drive>.allctl,#view-punts>.allctl,#view-kicks>.allctl{grid-column:1/-1}
  #view-log,#view-plan{max-width:900px;margin:0 auto}
  .tbwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tbwrap .teamblock{margin-bottom:0}
  .orow{grid-template-columns:48px 1fr 42px 64px 64px;gap:4px}
  .mrow{grid-template-columns:1fr 64px 64px 64px 72px 56px;gap:5px}
}
</style>
</head>
<body>
<div id="topbar">
<header>
  <div class="hrow1">
    <div class="brand">
      <!-- icon-192 is the clean roundel; logo-transparent.png has a baked-in
           wordmark that rendered as a ghost "b00mstick" behind the logo -->
      <img class="hlogo" src="assets/icon-192.png" alt="b00mstick logo">
      <img class="hword" src="assets/wordmark-white.png" alt="b00mstick">
    </div>
    <div class="hbtns" id="hbtns">
      <button id="ovrBtn">OVR</button>
    </div>
  </div>
  <div class="meta">
    <span class="chip" id="wkChip">week —</span>
    <span class="chip" id="genChip">loading slate…</span>
  </div>
</header>
</div>

<main>
  <div id="view-drive"></div>
  <div id="view-punts" class="hidden"></div>
  <div id="view-kicks" class="hidden"></div>
  <div id="view-log" class="hidden"></div>
  <div id="view-plan" class="hidden"></div>
</main>

<div id="ovr" class="hidden">
  <div class="panel">
    <h2 class="px">OVERRIDES</h2>
    <div class="note">Conservative flags: they mark uncertainty and pull a team toward league average in the weekly scoring run (player swaps re-prior the player). They do not inject coach tendencies — that factor failed the backtest.</div>
    <div class="orow2">
      <input class="num" id="ovTeam" placeholder="TEAM" maxlength="3">
      <select id="ovFlag">
        <option>NEW_QB</option><option>ROOKIE_QB</option><option>NEW_KICKER</option>
        <option>NEW_PUNTER</option><option>NEW_HC</option><option>NEW_OC</option><option>OTHER</option>
      </select>
      <button class="logb" onclick="addOverride()">ADD</button>
    </div>
    <input class="num" id="ovNote" placeholder="note (optional)" style="width:100%;margin:4px 0">
    <div id="ovList" class="note">loading…</div>
    <button class="logb" style="width:100%;margin-top:8px" onclick="document.getElementById('ovr').classList.add('hidden')">CLOSE</button>
  </div>
</div>

<nav>
  <button id="tab-drive" class="on" onclick="show('drive')">DRIVE</button>
  <button id="tab-punts" onclick="show('punts')">PUNTS</button>
  <button id="tab-kicks" onclick="show('kicks')">KICKS</button>
  <button id="tab-log" onclick="show('log')">LOG</button>
  <button id="tab-plan" onclick="show('plan')">PLAN</button>
</nav>

<script>
const SUPA_URL="https://sknvngcufmjypioyxdjt.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrbnZuZ2N1Zm1qeXBpb3l4ZGp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NzcyMjQsImV4cCI6MjEwMjE1MzIyNH0._mRhuAwDSGHQJHq8H50JHyJrVlBg5aXxbljc09MhCBg";
const SB_HDRS={apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"};
const TH={drive:{BET:.050,VALUE:.025},punts:{BET:.045,VALUE:.022},kicker:{BET:.045,VALUE:.022}};
const OUTS=["TD","FG","PUNT","OTHER"];
/* display labels matching DK's market buckets (internal keys unchanged):
   FG = attempt (made/missed/blocked), OTHER = turnover/downs/safety */
const OUT_LBL={TD:"TD",FG:"FG ATT",PUNT:"PUNT",OTHER:"TO/SAF"};
let SLATE=null,BETS=[];
const params=new URLSearchParams(location.search);
const wk=params.get("week");   // ?week=N views an archived slate

/* ---------- math ---------- */
const a2p=o=>o>0?100/(o+100):-o/(-o+100);
function devig2(a,b){const pa=a2p(a),pb=a2p(b);return[pa/(pa+pb),pb/(pa+pb)]}
function devigN(arr){const ps=arr.map(a2p),t=ps.reduce((x,y)=>x+y,0);return ps.map(p=>p/t)}
function tier(mp,fp,mkt){const e=mp-fp,t=TH[mkt];return[e>=t.BET?"BET":e>=t.VALUE?"VALUE":"PASS",e]}
function pois(mu,kmax){const p=[Math.exp(-mu)];for(let k=1;k<=kmax;k++)p.push(p[k-1]*mu/k);return p}
function priceCount(mu,line){
  const pmf=pois(mu,Math.max(30,Math.ceil(line)+12));
  let over=0,under=0,push=0;
  pmf.forEach((p,k)=>{if(k>line)over+=p;else if(k<line)under+=p;else push=p});
  return{over,under,push};
}
function priceDist(dist,shift,line){
  let over=0,under=0,push=0;
  for(const[k,p]of Object.entries(dist)){
    const v=Math.max(0,+k+shift);
    if(v>line)over+=p;else if(v<line)under+=p;else push+=p;
  }
  return{over,under,push};
}
const fmtP=p=>(100*p).toFixed(1)+"%";
/* odds fields assume a sign per market (DRIVE + longshots, PUNTS/KICKS -
   juice); typing an explicit + or - overrides. Field is rewritten signed. */
function normOdds(el,defNeg){
  const raw=String(el.value).trim();
  if(raw==="")return NaN;
  let v=parseFloat(raw);
  if(isNaN(v))return NaN;
  if(!/^[+-]/.test(raw))v=defNeg?-Math.abs(v):Math.abs(v);
  el.value=(v>0?"+":"")+v;
  return v;
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- load ---------- */
async function fetchSlate(path){
  const r=await fetch(path);
  if(!r.ok)throw new Error("HTTP "+r.status);
  return JSON.parse((await r.text()).replace(/\bNaN\b/g,"null"));
}
async function loadSlate(){
  if(wk)return fetchSlate(`output/week${wk}_slate.json`);   // archive view
  return fetchSlate("output/current_slate.json");           // written by every scoring run
}
/* fixed topbar: keep content clear of it whatever its current height */
function fitTop(){document.body.style.paddingTop=document.getElementById("topbar").offsetHeight+"px"}
window.addEventListener("resize",fitTop);
window.addEventListener("load",fitTop);
/* team logos (ESPN CDN); explicit 32-team map — no blind lowercasing */
const ESPN_LOGO={ARI:"ari",ATL:"atl",BAL:"bal",BUF:"buf",CAR:"car",CHI:"chi",
  CIN:"cin",CLE:"cle",DAL:"dal",DEN:"den",DET:"det",GB:"gb",HOU:"hou",IND:"ind",
  JAX:"jax",KC:"kc",LA:"lar",LAC:"lac",LV:"lv",MIA:"mia",MIN:"min",NE:"ne",
  NO:"no",NYG:"nyg",NYJ:"nyj",PHI:"phi",PIT:"pit",SEA:"sea",SF:"sf",TB:"tb",
  TEN:"ten",WAS:"wsh"};
const tlogo=(t,px=22)=>ESPN_LOGO[t]?`<img class="tlogo" width="${px}" height="${px}" src="https://a.espncdn.com/i/teamlogos/nfl/500/${ESPN_LOGO[t]}.png" alt="" aria-hidden="true" loading="lazy" onerror="this.style.display='none'">`:"";
/* where each tab's inputs live on DraftKings */
const DKPATH={
  drive:"1ST DRIVE tab &rarr; 1st Drive Result",
  punts:"GAME LINES (or POPULAR) &rarr; Game Total Line<span class='sep'>·</span>SPECIAL TEAMS &rarr; Punt Total (Total Punts)",
  kicks:"TEAM PROPS (or POPULAR) &rarr; Team Total Points<span class='sep'>·</span>SPECIAL TEAMS &rarr; Kicking Points O/U",
};
const dkPath=tab=>DKPATH[tab]?`<div class="dkpath"><b>FIND IT ON DK:</b>${DKPATH[tab]}</div>`:"";
/* collapsible how-to strips (state persists per-tab; localStorage may be
   unavailable in private browsing — degrade to session-only) */
const HOWTO={
  drive:"Bars = model probability for each first-drive outcome, both teams (coin-toss blended). Buckets match DK: FG ATT = made or missed attempt; TO/SAF = turnover, turnover on downs, or safety. Enter all 4 DK odds for a team (bare numbers assume +; type - to override) → we remove the vig and compare. Chips: BET ≥5.0 pts edge, VALUE ≥2.5, PASS otherwise. Tap a chip to log THAT outcome; LOG BEST saves the highest-edge one. Green border = you already have a drive bet on that game.",
  punts:"μ = model expected punts. Enter DK game total to re-price the model live (totals move punt expectations). Enter DK line + over/under odds (bare numbers assume −; type + to override) → devigged edge chips. Whole-number lines can PUSH — push probability is priced in. Green border = punts bet already logged on that game.",
  kicks:"TT = team total: that team's implied points from spread + game total — the model's scoring context for the kicker. Enter DK team total to shift the projection, then line + odds for edge chips (bare odds assume −; type + to override). Photos = projected starting kicker; punter listed below. Green border = kicker bet already logged on that game.",
  log:"Every logged bet freezes the model and fair (devigged) probability at bet time. Before kickoff, enter DK closing odds → CLV = devigged close minus your devigged price, in probability points. Two-way bets (punts/kicks): your side + opposite. DRIVE bets are 4-way: enter all four bucket closes and the app devigs across the whole market automatically. Positive average CLV is the real scoreboard — it converges in ~30 bets; win-loss record takes seasons. Results auto-grade Tuesday.",
};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function howTo(tab){
  if(!HOWTO[tab])return"";
  return`<div class="howto${lsGet("howto-"+tab)==="open"?" open":""}" id="howto-${tab}">

function calcDrive(gi,s){

    const d=document.getElementById(`dt-${gi}-${s}-${o}`);
    d.textContent=`${t} ${(100*e).toFixed(1)}`;d.className="tier "+t;

function logDrive(gi,s){
  const g=SLATE.games[gi];let best=null;
  OUTS.forEach(o=>{
    const d=document.getElementById(`dt-${gi}-${s}-${o}`);
    if(d.dataset.edge!==undefined&&(best===null||+d.dataset.edge>+best.edge))
      best={o,edge:d.dataset.edge,fair:d.dataset.fair,
            odds:document.getElementById(`d-${gi}-${s}-${o}`).value};
  });
  if(!best)return alert("Enter all four DK odds first.");
  const team=s==="home"?g.home:g.away;
  saveBet({game_id:g.game_id,market:"DRIVE",selection:`${team} 1st drive ${best.o}`,line:null,
    your_odds:+best.odds,model_prob:g.drive[s][best.o],fair_prob_at_bet:+best.fair,
    tier:document.getElementById(`dt-${gi}-${s}-${best.o}`).textContent.split(" ")[0]});

function logOutcome(gi,s,o){
  /* per-outcome log: tap the tier chip to save exactly this outcome,
     regardless of whether it is the highest edge in the block */
  const d=document.getElementById(`dt-${gi}-${s}-${o}`);
  if(d.dataset.edge===undefined)return alert("Enter all four DK odds first.");

  const odds=document.getElementById(`d-${gi}-${s}-${o}`).value;

  saveBet({game_id:g.game_id,market:"DRIVE",selection:`${team} 1st drive ${o}`,line:null,
    your_odds:+odds,model_prob:g.drive[s][o],fair_prob_at_bet:+d.dataset.fair,
    tier:d.textContent.split(" ")[0]});
}

    <div class="small">model: ${g.away} ${g.punts.away.mean} · ${g.home} ${g.punts.home.mean} · game ${g.punts.game_mean} (sched total ${g.lines.total_line})</div>
    <div class="mrow"><span class="lab">DK game total</span>
      <input class="num" id="pt-${gi}" value="${g.lines.total_line}" inputmode="decimal" onchange="calcPunts(${gi})">
      <input class="num" id="pl-${gi}" placeholder="line" value="${(Math.round(g.punts.game_mean)+0.5).toFixed(1)}" inputmode="decimal" onchange="calcPunts(${gi})">
      <input class="odds" id="po-${gi}" placeholder="over" inputmode="numeric" onchange="calcPunts(${gi})">
      <input class="odds" id="pu-${gi}" placeholder="under" inputmode="numeric" onchange="calcPunts(${gi})">
      <span class="small" id="pp-${gi}"></span></div>
    <div class="mrow"><span class="lab" id="pinfo-${gi}">P(over) —</span>
      <div class="tier" id="ptov-${gi}">OVER</div><div class="tier" id="ptun-${gi}">UNDER</div>
      <span></span><span></span><button class="logb" onclick="logPunts(${gi})">LOG</button></div>
  </div></div>`).join("");
}
function puntsMu(gi){
  const g=SLATE.games[gi];
  const dkT=parseFloat(document.getElementById(`pt-${gi}`).value)||g.lines.total_line;
  const adj=(dkT-g.lines.total_line);
  return g.punts.game_mean+adj*(g.punts.home.tt_slope+g.punts.away.tt_slope);
}
function calcPunts(gi){
  const line=parseFloat(document.getElementById(`pl-${gi}`).value);if(isNaN(line))return;
  const mu=puntsMu(gi);
  const pr=priceCount(mu,line);
  document.getElementById(`pinfo-${gi}`).textContent=`μ ${mu.toFixed(2)} · P(o) ${fmtP(pr.over)}${pr.push?" · push "+fmtP(pr.push):""}`;
  const oo=normOdds(document.getElementById(`po-${gi}`),true),uo=normOdds(document.getElementById(`pu-${gi}`),true);
  if(isNaN(oo)||isNaN(uo))return;
  const[fo,fu]=devig2(oo,uo);
  const sc=1-pr.push;   // compare on action-only basis
  const[t1,e1]=tier(pr.over/sc,fo,"punts"),[t2,e2]=tier(pr.under/sc,fu,"punts");
  const A=document.getElementById(`ptov-${gi}`),B=document.getElementById(`ptun-${gi}`);
  A.textContent=`OVER ${(100*e1).toFixed(1)}`;A.className="tier "+t1;A.dataset.d=JSON.stringify({t:t1,e:e1,f:fo,p:pr.over/sc});
  B.textContent=`UNDER ${(100*e2).toFixed(1)}`;B.className="tier "+t2;B.dataset.d=JSON.stringify({t:t2,e:e2,f:fu,p:pr.under/sc});
}
function logPunts(gi){
  const g=SLATE.games[gi];
  const A=document.getElementById(`ptov-${gi}`),B=document.getElementById(`ptun-${gi}`);
  if(!A.dataset.d)return alert("Enter line and both odds first.");
  const a=JSON.parse(A.dataset.d),b=JSON.parse(B.dataset.d);
  const pick=a.e>=b.e?{side:"over",...a,odds:document.getElementById(`po-${gi}`).value}
                     :{side:"under",...b,odds:document.getElementById(`pu-${gi}`).value};
  saveBet({game_id:g.game_id,market:"PUNTS",selection:`game punts ${pick.side}`,
    line:parseFloat(document.getElementById(`pl-${gi}`).value),your_odds:+pick.odds,
    model_prob:pick.p,fair_prob_at_bet:pick.f,tier:pick.t});
}

function calcKick(gi,s){
  const g=SLATE.games[gi],k=g.kickers[s];

  const dktt=parseFloat(document.getElementById(`ktt-${gi}-${s}`).value)||k.tt_base;

  const pr=priceDist(k.dist,shift,line);
  document.getElementById(`ki-${gi}-${s}`).textContent=`μ ${(k.mean+k.tt_slope*(dktt-k.tt_base)).toFixed(2)} · P(o) ${fmtP(pr.over)}`;
  const oo=normOdds(document.getElementById(`ko-${gi}-${s}`),true),uo=normOdds(document.getElementById(`ku-${gi}-${s}`),true);
  if(isNaN(oo)||isNaN(uo))return;
  const[fo,fu]=devig2(oo,uo);const sc=1-pr.push;
  const[t1,e1]=tier(pr.over/sc,fo,"kicker"),[t2,e2]=tier(pr.under/sc,fu,"kicker");
  const A=document.getElementById(`kto-${gi}-${s}`),B=document.getElementById(`ktu-${gi}-${s}`);
  A.textContent=`OVER ${(100*e1).toFixed(1)}`;A.className="tier "+t1;A.dataset.d=JSON.stringify({t:t1,e:e1,f:fo,p:pr.over/sc});
  B.textContent=`UNDER ${(100*e2).toFixed(1)}`;B.className="tier "+t2;B.dataset.d=JSON.stringify({t:t2,e:e2,f:fu,p:pr.under/sc});
}
function logKick(gi,s){

      <button class="logb" onclick="saveEdit('${b.id}')">SAVE</button>
      <button class="logb del" onclick="delBet('${b.id}')">DELETE</button>
    </div></div>`;
  };
  el.innerHTML=howTo("log")+`<div class="sumbar">
      <div>BETS<b>${BETS.length}</b></div><div>RECORD<b>${wl}</b></div>
      <div>AVG CLV<b class="${+avg>0?'clv pos':''}">${avg}${clvs.length?" pts":""}</b></div>
      <div>CLV SAMPLE<b>${clvs.length}</b></div></div>
    <div class="note">Enter DK closing odds (your side + opposite side) at kickoff — CLV = devigged close minus devigged bet price, in probability points.</div>
    ${BETS.map(betCard).join("")||'<div class="note">No bets logged yet — price a market and hit LOG.</div>'}`;
  markLogged();
}
/* green-flag every game card that already has a logged bet in that tab's market */
function markLogged(){
  const mk={drive:"DRIVE",punts:"PUNTS",kicks:"KICKS"};
  for(const[tab,m]of Object.entries(mk)){
    const gids=new Set(BETS.filter(b=>b.market===m).map(b=>b.game_id));
    document.querySelectorAll(`#view-${tab} .game`).forEach(c=>
      c.classList.toggle("hasbet",gids.has(c.dataset.gid)));
  }
}
async function setClose(id,mineEl,oppEl){
  const b=BETS.find(x=>x.id===id);
  const mv=mineEl?normOdds(mineEl,true):NaN, ov=oppEl?normOdds(oppEl,true):NaN;
  const close=mineEl?(isNaN(mv)?null:mv):b.close_odds;
  const oc=oppEl?(isNaN(ov)?null:ov):b.opp_close_odds;
  const patch={close_odds:close||null,opp_close_odds:oc||null};
  if(close&&oc){const[fc]=devig2(close,oc);patch.clv_pct=100*(fc-b.fair_prob_at_bet)}
  await fetch(`${SUPA_URL}/rest/v1/b00mstick_bets?id=eq.${id}`,{method:"PATCH",headers:SB_HDRS,body:JSON.stringify(patch)});
  loadBets();
}
async function setClose4(id){
  /* 4-way close for DRIVE bets: store your side's close as soon as it's
     entered; once all four are in, devig the bucket and compute CLV. */
  const b=BETS.find(x=>x.id===id);
  const key=String(b.selection).split(" 1st drive ")[1];
  const vals=OUTS.map(o=>normOdds(document.getElementById(`c4-${id}-${o}`),false));
  const mine=vals[OUTS.indexOf(key)];
  const patch={close_odds:isNaN(mine)?null:mine};
  if(vals.every(v=>!isNaN(v)))
    patch.clv_pct=100*(devigN(vals)[OUTS.indexOf(key)]-b.fair_prob_at_bet);
  await fetch(`${SUPA_URL}/rest/v1/b00mstick_bets?id=eq.${id}`,{method:"PATCH",headers:SB_HDRS,body:JSON.stringify(patch)});
  loadBets();
}
function toggleEdit(id){document.getElementById("ed-"+id).classList.toggle("hidden")}
async function saveEdit(id){
  const b=BETS.find(x=>x.id===id);
  const o=normOdds(document.getElementById("edo-"+id),b.market!=="DRIVE");
  const l=document.getElementById("edl-"+id).value.trim();
  if(isNaN(o))return alert("Odds required (American, e.g. -110).");
  if(l!==""&&isNaN(parseFloat(l)))return alert("Line must be a number, or blank for none.");
  await fetch(`${SUPA_URL}/rest/v1/b00mstick_bets?id=eq.${id}`,{method:"PATCH",headers:SB_HDRS,
    body:JSON.stringify({your_odds:o,line:l===""?null:parseFloat(l)})});
  loadBets();
}
async function delBet(id){
  if(!confirm("Delete this bet permanently? This cannot be undone."))return;
  await fetch(`${SUPA_URL}/rest/v1/b00mstick_bets?id=eq.${id}`,{method:"DELETE",headers:SB_HDRS});
  loadBets();
}
async function setResult(id,val){
  await fetch(`${SUPA_URL}/rest/v1/b00mstick_bets?id=eq.${id}`,{method:"PATCH",headers:SB_HDRS,body:JSON.stringify({result:val})});
  loadBets();
}

/* ---------- overrides ---------- */
async function loadOverrides(){
  const el=document.getElementById("ovList");
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/b00mstick_overrides?select=*&active=eq.true&order=created_at.desc`,{headers:SB_HDRS});
    const rows=await r.json();
    el.innerHTML=rows.length?rows.map(o=>
      `<div class="orow2"><b>${esc(o.team)}</b><span>${esc(o.flag)}${o.note?" — "+esc(o.note):""}</span>
       <button class="logb" onclick="dropOverride('${o.id}')">X</button></div>`).join("")
      :"No active overrides.";
  }catch(e){el.textContent="Overrides unavailable — create the Supabase tables."}
}
async function addOverride(){
  const team=document.getElementById("ovTeam").value.toUpperCase().trim();
  if(!team)return;
  await fetch(`${SUPA_URL}/rest/v1/b00mstick_overrides`,{method:"POST",headers:SB_HDRS,
    body:JSON.stringify({season:SLATE?.season??2026,team,flag:document.getElementById("ovFlag").value,
                         note:document.getElementById("ovNote").value})});
  document.getElementById("ovTeam").value="";document.getElementById("ovNote").value="";
  loadOverrides();
}
async function dropOverride(id){
  await fetch(`${SUPA_URL}/rest/v1/b00mstick_overrides?id=eq.${id}`,{method:"PATCH",headers:SB_HDRS,
    body:JSON.stringify({active:false})});
  loadOverrides();
}
document.getElementById("ovrBtn").onclick=()=>document.getElementById("ovr").classList.remove("hidden");
boot();
</script>
