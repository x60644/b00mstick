<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070e0a">
<title>b00mstick</title>
<meta name="description" content="NFL props model: first drive, punts, kicker points. Priced against DK, judged by CLV.">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta property="og:title" content="b00mstick">
<meta property="og:description" content="NFL props: first drive, punts, kicks.">
<meta property="og:image" content="assets/og-1200x630.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* all-green palette keyed to the logo roundel; red stays for losses */
  --bg:#070e0a; --card:#0f1a13; --card2:#15231b; --line:#23382b;
  --chalk:#edf4ee; --dim:#8da899;
  --boom:#2fe27e; --cyan:#4ad8c2; --gold:#a7ecc3;
  --red:#ff7a6b; --green:#4fe0a6;
  --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--chalk);font:16px/1.5 'Barlow Condensed',sans-serif;padding-bottom:76px}
.px{font-family:'Bungee',sans-serif}
/* fixed header bar (like the footer nav); body padding set by fitTop().
   Mobile: two rows (brand+buttons / chips). Desktop: one row. */
#topbar{position:fixed;top:0;left:0;right:0;z-index:45}
header{background:rgba(7,14,10,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.hrow1{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.hlogo{width:34px;height:34px}
.hword{height:18px;display:block;opacity:.95}
.hbtns{display:flex;align-items:center;gap:8px;margin-left:auto}
.hbtns .chip{min-height:40px;display:inline-flex;align-items:center;padding:6px 12px}
.meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;letter-spacing:.5px;background:var(--card);border:1px solid var(--line);padding:3px 12px;border-radius:99px;color:var(--dim)}
#ovrBtn{background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:'Bungee',sans-serif;font-size:10px;letter-spacing:1px;padding:8px 14px;border-radius:99px;cursor:pointer;min-height:40px}
#ovrBtn:hover{background:rgba(167,236,195,.08)}
/* tabs */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(6,12,8,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:40}
nav button{flex:1;background:none;border:none;color:var(--dim);font-family:'Bungee',sans-serif;font-size:10px;letter-spacing:.5px;padding:15px 2px calc(15px + env(safe-area-inset-bottom));min-height:44px;cursor:pointer}
nav button.on{color:var(--boom);box-shadow:inset 0 2px 0 var(--boom)}
main{max-width:760px;margin:0 auto;padding:14px 12px}
.hidden{display:none!important}
/* cards */
.game{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:8px;background:var(--card2);padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;cursor:pointer}
.gchev{color:var(--dim);font-size:11px;margin-left:4px;display:inline-block;transition:transform .15s}
.game.clp .gbody{display:none}
.game.clp .gchev{transform:rotate(-90deg)}
.game.clp .ghead{border-bottom:none}
.allctl{display:flex;justify-content:flex-end}
.allctl button{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:inherit;font-weight:600;letter-spacing:1px;font-size:12px;padding:7px 14px;border-radius:99px;cursor:pointer;min-height:40px;margin-bottom:12px}
.allctl button:hover{border-color:var(--gold);color:var(--gold)}
.ghead .vs{font-size:13px}
.ghead .kick{color:var(--dim);font-size:12px;letter-spacing:.5px;margin-left:auto}
.badge{font-size:10px;font-weight:600;letter-spacing:1px;padding:2px 8px;border-radius:99px;border:1px solid}
.tlogo{vertical-align:middle;margin-right:3px}
.badge.wind{color:var(--cyan);border-color:#1e5c55}
.badge.dome{color:var(--dim);border-color:var(--line)}
.badge.newpc{color:var(--gold);border-color:#2c5c3f}
.badge.ovr{color:var(--gold);border-color:#2c5c3f}
/* plan tab */
.plan-h{font-family:'Bungee',sans-serif;font-size:11px;letter-spacing:.5px;color:var(--gold);margin-bottom:6px}
.ptog{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;background:none;border:none;cursor:pointer;padding:0;min-height:40px;text-align:left}
.plansec.clp .plan-body{display:none}
.plansec.clp .gchev{transform:rotate(-90deg)}
.plan-row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.plan-row:last-child{border-bottom:none}
.plan-glyph{font-weight:700;font-size:13px}
.plan-glyph.done{color:var(--green)}
.plan-glyph.pend{color:var(--dim)}
.plan-date{color:var(--dim);font-size:12px;white-space:nowrap}
.plan-note{grid-column:2/4;color:var(--dim);font-size:13px}
.gbody{padding:12px 14px;position:relative}
/* coach strip (DRIVE tab): away | home, chips match kicker mugshot framing */
.cstrip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.cchip{display:flex;gap:9px;align-items:center;margin-bottom:6px;min-width:0}
.cchip img,.cph{width:44px;height:44px;object-fit:cover;object-position:top;border-radius:50%;background:var(--card2);box-shadow:0 0 0 2px var(--line);flex:0 0 auto;filter:grayscale(1) contrast(1.4) brightness(1.08)}
.cph{display:flex;align-items:center;justify-content:center;font-family:'Bungee',sans-serif;font-size:13px;color:var(--dim);filter:none}
.cinfo{min-width:0}
.cname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crole{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.ctag{font-weight:700;letter-spacing:1px;font-size:10px;color:var(--gold);border:1px solid #2c5c3f;border-radius:99px;padding:1px 7px;display:inline-block;margin-top:3px}
/* drive rows */
.teamblock{margin-bottom:12px}
.tname{font-family:'Bungee',sans-serif;font-size:11px;letter-spacing:.5px;color:var(--gold);margin-bottom:8px}
.orow{display:grid;grid-template-columns:52px 1fr 64px 74px 84px;gap:6px;align-items:center;margin-bottom:6px}
.olab{font-size:13px;letter-spacing:.5px;color:var(--dim)}
.bar{height:8px;background:var(--card2);border-radius:99px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--boom),var(--gold));border-radius:99px}
.pct{font-family:var(--mono);font-size:11px;text-align:right}
input.odds,input.num{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--chalk);padding:6px 7px;border-radius:8px;font:12px var(--mono)}
/* touch devices: mobile keyboards often lack a minus key — each odds field
   gets a tap-to-flip sign button (desktop keeps plain fields) */
.oddswrap{display:flex;align-items:stretch;min-width:0}
.oddswrap input{flex:1;min-width:0;border-radius:0 8px 8px 0}
.sgn{flex:0 0 24px;background:var(--card2);border:1px solid var(--line);border-right:none;color:var(--gold);font-weight:700;font-size:13px;border-radius:8px 0 0 8px;cursor:pointer;padding:0}
input:focus,select:focus{outline:none;border-color:var(--gold)}
.tier{font-weight:700;letter-spacing:.5px;font-size:11px;padding:6px 0;text-align:center;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--dim);cursor:pointer;font-variant-numeric:tabular-nums}
/* game has a logged bet for this tab's market */
.game.hasbet{border-color:#1e5c46;box-shadow:0 0 12px -2px rgba(79,224,166,.35)}
.game.hasbet .ghead::after{content:"✓ LOGGED";color:var(--green);font-weight:700;font-size:10px;letter-spacing:1px;margin-left:6px}
.tier.BET{border-color:#1e5c38;background:#0e3a22;color:#3bf08c}
.tier.VALUE{border-color:#1e5c55;background:#0e332f;color:var(--cyan)}
.mrow{display:grid;grid-template-columns:1fr 74px 74px 74px 84px 60px;gap:6px;align-items:center;margin:6px 0}
/* phones: the fixed mrow columns exceed a narrow card (PUNTS row, and the
   KICKS row inside .mug loses 64px more to the mugshot) — shrink them */
@media (max-width:767px){
  .mrow{grid-template-columns:minmax(0,1fr) 44px 44px 44px 52px 42px;gap:4px}
  .mug{gap:8px}
  .mug img{width:56px;height:56px}
  .mug .info{min-width:0}
}
.mrow .lab{font-size:13px;color:var(--dim)}
.logb{background:transparent;border:1px solid #1e5c46;color:var(--green);font-family:inherit;font-weight:700;letter-spacing:1px;font-size:12px;padding:8px 8px;border-radius:8px;cursor:pointer;min-height:40px}
.logb:hover{background:rgba(79,224,166,.08)}
.small{font-size:13px;color:var(--dim)}
/* kicker / punter cards */
.mug{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.mug img{width:64px;height:64px;object-fit:cover;object-position:top;border-radius:50%;background:var(--card2);box-shadow:0 0 0 2px var(--line);filter:grayscale(1) contrast(1.4) brightness(1.08)}
.mug .info{flex:1}
.mug .pname{font-weight:600;font-size:15px}
.mug .proj{color:var(--gold);font-size:13px;margin:4px 0}
/* log */
.sumbar{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;flex-wrap:wrap}
.sumbar div{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.sumbar b{display:block;font-family:'Bungee',sans-serif;font-weight:400;font-size:17px;color:var(--chalk);margin-top:5px;letter-spacing:0}
.bet{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.bet .top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.bet .clv{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:12px}
.clv.pos{color:var(--green)} .clv.neg{color:var(--red)}
.bet .closerow{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:6px;margin-top:8px;align-items:center}
.editrow{grid-template-columns:1fr 1fr auto auto!important}
.c4{grid-template-columns:repeat(4,1fr)!important}
.cbar{grid-template-columns:1fr auto auto!important;margin-top:6px!important}
.logb.del{border-color:#5c2e1e;color:#ff8a5c}
.edtog{border-color:var(--line);color:var(--dim)}
select{background:var(--card2);border:1px solid var(--line);color:var(--chalk);padding:6px;border-radius:8px;font:inherit;font-size:13px}
/* overlay */
#ovr{position:fixed;inset:0;background:rgba(4,10,6,.85);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:50;overflow:auto;padding:16px}
#ovr .panel{max-width:560px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.orow2{display:grid;grid-template-columns:80px 1fr auto;gap:6px;margin:6px 0;align-items:center}
h2.px{font-size:13px;letter-spacing:.5px;margin-bottom:10px;color:var(--gold)}
.note{font-size:13px;color:var(--dim);margin:8px 0}
.err{color:var(--red);font-size:13px;padding:10px;text-align:center}
.loading{font-family:'Bungee',sans-serif;font-size:11px;color:var(--dim);text-align:center;padding:40px 10px}
/* DK locator header per market tab */
.dkpath{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--boom);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--chalk);line-height:1.6}
.dkpath b{color:var(--boom);font-weight:700;letter-spacing:1px;margin-right:6px}
.dkpath .sep{color:var(--dim);margin:0 6px}
/* per-game model explainer (skyh00k whyline pattern) */
.whyline{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--dim);line-height:1.55}
.whyline b{color:var(--chalk);font-weight:600}
.whyline div+div{margin-top:4px}
/* audit tab */
.astats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.astat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
.astat .k{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.astat .v{font-family:'Bungee',sans-serif;font-size:16px;margin-top:6px}
.astat .v.pos{color:var(--green)} .astat .v.neg{color:#ff8a5c}
.astat .sub{font-size:12px;color:var(--dim);margin-top:2px}
.anote{font-size:12px;color:var(--dim);margin-bottom:12px;text-align:center}
.amkt{font-family:'Bungee',sans-serif;font-size:10px;letter-spacing:.5px;color:var(--gold);margin:12px 0 2px}
.amkt:first-child{margin-top:0}
.ahead,.arow{display:grid;grid-template-columns:minmax(0,1fr) 46px 46px 46px 44px;gap:6px;align-items:center}
.ahead{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);padding:6px 0 4px}
.ahead span:not(:first-child),.an{text-align:right}
.arow{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.arow:last-child{border-bottom:none}
.arow>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an{font-family:var(--mono);font-size:12px}
.rslt{font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 0;border-radius:4px;text-align:center}
.rslt.hit{background:#123326;color:var(--green)}
.rslt.miss{background:#3a1610;color:#ff8a5c}
.rslt.tie{background:var(--card2);color:var(--dim)}
.badge.aok{color:var(--green);border-color:#1e5c46}
.badge.abad{color:#ff8a5c;border-color:#5c2e1e}
/* collapsible how-to strips */
.howto{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.howto>button{width:100%;background:none;border:none;color:var(--gold);font-family:'Bungee',sans-serif;font-size:10px;letter-spacing:.5px;text-align:left;padding:13px 14px;cursor:pointer;min-height:40px}
.howto .body{display:none;padding:0 14px 12px;font-size:14px;line-height:1.55;color:var(--chalk)}
.howto.open .body{display:block}
/* ---------- desktop (mobile untouched below 1024px) ---------- */
@media (min-width:1024px){
  main{max-width:1150px}
  header{display:flex;align-items:center;gap:14px}
  .hrow1{display:contents}
  .brand{order:1}
  .meta{order:2;margin:0 0 0 auto}
  .hbtns{order:3;margin-left:0}
  .hlogo{width:40px;height:40px}
  .hword{height:24px}
  #view-drive,#view-punts,#view-kicks{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  #view-drive:not(.hidden),#view-punts:not(.hidden),#view-kicks:not(.hidden){display:grid}
  #view-drive .game,#view-punts .game,#view-kicks .game{margin-bottom:0}
  #view-drive>.howto,#view-punts>.howto,#view-kicks>.howto,#view-drive>.err{grid-column:1/-1}
  #view-drive>.dkpath,#view-punts>.dkpath,#view-kicks>.dkpath{grid-column:1/-1}
  #view-drive>.allctl,#view-punts>.allctl,#view-kicks>.allctl{grid-column:1/-1}
  #view-log,#view-plan,#view-audit{max-width:900px;margin:0 auto}
  .tbwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tbwrap .teamblock{margin-bottom:0}
  .orow{grid-template-columns:38px minmax(20px,1fr) 36px 52px 56px;gap:4px}
  .mrow{grid-template-columns:1fr 64px 64px 64px 72px 56px;gap:5px}
}
</style>
</head>
<body>
<div id="topbar">
<header>
  <div class="hrow1">
    <div class="brand">
      <!-- icon-192 is the clean roundel; logo-transparent.png has a baked-in
           wordmark that rendered as a ghost "b00mstick" behind the logo -->
      <img class="hlogo" src="assets/icon-192.png" alt="b00mstick logo">
      <img class="hword" src="assets/wordmark-white.png" alt="b00mstick">
    </div>
    <div class="hbtns" id="hbtns">
      <button id="ovrBtn">OVR</button>
    </div>
  </div>
  <div class="meta">
    <span class="chip" id="wkChip">week —</span>
    <span class="chip" id="genChip">loading slate…</span>
  </div>
</header>
</div>

<main>
  <!-- DRIVE market hidden for now (model only coin-flips naive in-season);
       code + data intact, ?tab=drive still works -->
  <div id="view-drive" class="hidden"></div>
  <div id="view-punts"></div>
  <div id="view-kicks" class="hidden"></div>
  <div id="view-audit" class="hidden"></div>
  <div id="view-log" class="hidden"></div>
  <div id="view-plan" class="hidden"></div>
</main>

<div id="ovr" class="hidden">
  <div class="panel">
    <h2 class="px">OVERRIDES</h2>
    <div class="note">Conservative flags: they mark uncertainty and pull a team toward league average in the weekly scoring run (player swaps re-prior the player). They do not inject coach tendencies — that factor failed the backtest.</div>
    <div class="orow2">
      <input class="num" id="ovTeam" placeholder="TEAM" maxlength="3">
      <select id="ovFlag">
        <option>NEW_QB</option><option>ROOKIE_QB</option><option>NEW_KICKER</option>
        <option>NEW_PUNTER</option><option>NEW_HC</option><option>NEW_OC</option><option>OTHER</option>
      </select>
      <button class="logb" onclick="addOverride()">ADD</button>
    </div>
    <input class="num" id="ovNote" placeholder="note (optional)" style="width:100%;margin:4px 0">
    <div id="ovList" class="note">loading…</div>
    <button class="logb" style="width:100%;margin-top:8px" onclick="document.getElementById('ovr').classList.add('hidden')">CLOSE</button>
  </div>
</div>

<nav>
  <button id="tab-drive" style="display:none" onclick="show('drive')">DRIVE</button>
  <button id="tab-punts" class="on" onclick="show('punts')">PUNTS</button>
  <button id="tab-kicks" onclick="show('kicks')">KICKS</button>
  <button id="tab-audit" onclick="show('audit')">AUDIT</button>
  <button id="tab-log" onclick="show('log')">LOG</button>
  <button id="tab-plan" onclick="show('plan')">PLAN</button>
</nav>

<script>
const SUPA_URL="https://sknvngcufmjypioyxdjt.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrbnZuZ2N1Zm1qeXBpb3l4ZGp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NzcyMjQsImV4cCI6MjEwMjE1MzIyNH0._mRhuAwDSGHQJHq8H50JHyJrVlBg5aXxbljc09MhCBg";
const SB_HDRS={apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"};
const TH={drive:{BET:.050,VALUE:.025},punts:{BET:.045,VALUE:.022},kicker:{BET:.045,VALUE:.022}};
const OUTS=["TD","FG","PUNT","OTHER"];
/* display labels matching DK's market buckets (internal keys unchanged):
   FG = attempt (made/missed/blocked), OTHER = turnover/downs/safety */
const OUT_LBL={TD:"TD",FG:"FG ATT",PUNT:"PUNT",OTHER:"TO/SAF"};
let SLATE=null,BETS=[];
const params=new URLSearchParams(location.search);
const wk=params.get("week");   // ?week=N views an archived slate

/* ---------- math ---------- */
const a2p=o=>o>0?100/(o+100):-o/(-o+100);
function devig2(a,b){const pa=a2p(a),pb=a2p(b);return[pa/(pa+pb),pb/(pa+pb)]}
function devigN(arr){const ps=arr.map(a2p),t=ps.reduce((x,y)=>x+y,0);return ps.map(p=>p/t)}
function tier(mp,fp,mkt){const e=mp-fp,t=TH[mkt];return[e>=t.BET?"BET":e>=t.VALUE?"VALUE":"PASS",e]}
function pois(mu,kmax){const p=[Math.exp(-mu)];for(let k=1;k<=kmax;k++)p.push(p[k-1]*mu/k);return p}
function priceCount(mu,line){
  const pmf=pois(mu,Math.max(30,Math.ceil(line)+12));
  let over=0,under=0,push=0;
  pmf.forEach((p,k)=>{if(k>line)over+=p;else if(k<line)under+=p;else push=p});
  return{over,under,push};
}
function priceDist(dist,shift,line){
  let over=0,under=0,push=0;
  for(const[k,p]of Object.entries(dist)){
    const v=Math.max(0,+k+shift);
    if(v>line)over+=p;else if(v<line)under+=p;else push+=p;
  }
  return{over,under,push};
}
const fmtP=p=>(100*p).toFixed(1)+"%";
/* odds fields assume a sign per market (DRIVE + longshots, PUNTS/KICKS -
   juice); typing an explicit + or - overrides. Field is rewritten signed. */
function normOdds(el,defNeg){
  const raw=String(el.value).trim();
  if(raw==="")return NaN;
  let v=parseFloat(raw);
  if(isNaN(v))return NaN;
  if(!/^[+-]/.test(raw)){
    const neg=el.dataset.sign?el.dataset.sign==="-":defNeg;   // ± button can pre-set the sign
    v=neg?-Math.abs(v):Math.abs(v);
  }
  el.value=(v>0?"+":"")+v;
  return v;
}
/* touch-only sign toggles on odds fields (mobile keyboards lack a minus key) */
const COARSE=matchMedia("(pointer:coarse)").matches;
function enhanceSigns(root){
  if(!COARSE||!root)return;
  root.querySelectorAll("input.odds").forEach(inp=>{
    if(inp.parentElement.classList.contains("oddswrap"))return;
    const w=document.createElement("span");w.className="oddswrap";
    inp.parentNode.insertBefore(w,inp);
    const b=document.createElement("button");b.type="button";b.className="sgn";
    b.textContent="±";
    b.onclick=e=>{e.stopPropagation();flipSign(inp,b)};
    w.appendChild(b);w.appendChild(inp);
  });
}
function flipSign(inp,b){
  const raw=inp.value.trim();
  if(raw!==""&&!isNaN(parseFloat(raw))){          // value present: negate it, reprice
    const v=-parseFloat(raw);
    inp.value=(v>0?"+":"")+v;
    inp.dispatchEvent(new Event("change"));
  }else{                                          // empty: prime the sign for next entry
    inp.dataset.sign=inp.dataset.sign==="-"?"+":"-";
    b.textContent=inp.dataset.sign;
  }
}

const fs2=v=>(Math.round(v*100)/100).toFixed(2);
function whyPunts(g){
  const rows=["away","home"].map(s=>{
    const w=(g.punts[s]||{}).why;if(!w)return"";
    const t=s==="home"?g.home:g.away,o=s==="home"?g.away:g.home;
    const base=g.punts[s].mean-w.tot_adj-w.wind_adj;
    const adj=[];
    if(w.tot_adj)adj.push(`${w.tot_adj>0?"+":"&minus;"}${fs2(Math.abs(w.tot_adj))} game total ${g.lines.total_line} vs ${w.mean_tot} avg`);
    if(w.wind_adj)adj.push(`${w.wind_adj>0?"+":"&minus;"}${fs2(Math.abs(w.wind_adj))} wind`);
    return`<div><b>${t} ${fs2(g.punts[s].mean)}</b> = ${fs2(base)} recent form (${t} punt rate &times;${w.team_f}, ${o} forces &times;${w.opp_f}, league ${w.lg}/gm)${adj.length?", "+adj.join(", "):""}</div>`;
  }).join("");
  return rows?`<div class="whyline">${rows}</div>`:"";
}
function whyKick(k,team){
  const w=k.why;if(!w)return"";
  const fg=3*w.fga*w.fg_pct*w.wind_pct,xp=w.xpa*w.xp_pct;
  return`<div class="whyline"><div><b>${fs2(k.mean)} pts</b> = ${fs2(fg)} from FGs (${w.fga} att &times; ${(100*w.fg_pct).toFixed(1)}% make &times; 3${w.wind_pct<1?" &times; 0.95 wind":""}) + ${fs2(xp)} from XPs (${w.xpa} att &times; ${(100*w.xp_pct).toFixed(1)}%) &middot; attempts from ${team} FG-range form (${w.t_fga}/gm vs league ${w.lg_fga}) + team total ${k.tt_base}</div></div>`;
}

function puntsMu(gi){

function calcPunts(gi){

  B.textContent=`UNDER ${(100*e2).toFixed(1)}`;B.className="tier "+t2;B.dataset.d=JSON.stringify({t:t2,e:e2,f:fu,p:pr.under/sc});

function logKick(gi,s){
  const g=SLATE.games[gi],k=g.kickers[s];
  const A=document.getElementById(`kto-${gi}-${s}`),B=document.getElementById(`ktu-${gi}-${s}`);
  if(!A.dataset.d)return alert("Enter line and both odds first.");
  const a=JSON.parse(A.dataset.d),b=JSON.parse(B.dataset.d);
  const pick=a.e>=b.e?{side:"over",...a,odds:document.getElementById(`ko-${gi}-${s}`).value}
                     :{side:"under",...b,odds:document.getElementById(`ku-${gi}-${s}`).value};
  saveBet({game_id:g.game_id,market:"KICKS",selection:`${k.name} pts ${pick.side}`,
    line:parseFloat(document.getElementById(`kl-${gi}-${s}`).value),your_odds:+pick.odds,
    model_prob:pick.p,fair_prob_at_bet:pick.f,tier:pick.t});
}

/* ---------- AUDIT ----------
   Model vs reality for every archived slate (output/audit.json, written by
   audit_week.py in the Tuesday cron). HIT = model closer to the actual than
   the naive league-average baseline. */
async function renderAudit(){
  const el=document.getElementById("view-audit");
  let A=null;
  try{const r=await fetch("output/audit.json");if(r.ok)A=await r.json()}catch(e){}
  if(!A||!(A.weeks||[]).length){
    el.innerHTML=howTo("audit")+'<div class="note">No audit yet — audit_week.py runs in the Tuesday cron once a week has final stats.</div>';
    return;
  }
  const wks=[...A.weeks].sort((a,b)=>b.week-a.week);
  const fmt1=v=>v==null?"—":String(Math.round(v*10)/10);
  const closer=r=>r.actual==null?null
    :Math.abs(r.model-r.actual)<Math.abs(r.naive-r.actual)?1
    :Math.abs(r.model-r.actual)>Math.abs(r.naive-r.actual)?0:.5;
  const badge=r=>{const c=closer(r);
    return c==null?'<span class="rslt tie">DNP</span>'
      :c===1?'<span class="rslt hit">HIT</span>'
      :c===0?'<span class="rslt miss">MISS</span>':'<span class="rslt tie">TIE</span>'};
  const agg=m=>{const rows=wks.flatMap(w=>w[m].rows).filter(r=>r.actual!=null);
    const s=k=>rows.reduce((t,r)=>t+Math.abs(r[k]-r.actual),0)/rows.length;
    const beat=wks.filter(w=>w[m].model_mae!=null&&w[m].model_mae<w[m].naive_mae).length;
    return{n:rows.length,model:s("model"),naive:s("naive"),beat}};
  const P=agg("punts"),K=agg("kicks");
  const tile=(k,o)=>`<div class="astat"><div class="k">${k}</div>
    <div class="v ${o.model<o.naive?"pos":"neg"}">${o.model.toFixed(2)}</div>
    <div class="sub">naive ${o.naive.toFixed(2)} · beat ${o.beat}/${wks.length} wks</div></div>`;
  const an=v=>`<span class="an">${fmt1(v)}</span>`;
  const sect=(title,rows)=>rows?`<div class="amkt">${title}</div>
    <div class="ahead"><span></span><span>MODEL</span><span>ACTUAL</span><span>NAIVE</span><span></span></div>${rows}`:"";
  const wkCard=(w,i)=>{
    const prow=w.punts.rows.map(r=>`<div class="arow"><span>${esc(r.game)}</span>${an(r.model)}${an(r.actual)}${an(r.naive)}${badge(r)}</div>`).join("");
    const krow=w.kicks.rows.map(r=>`<div class="arow"><span>${esc(r.kicker)} · ${esc(r.team)}</span>${an(r.model)}${an(r.actual)}${an(r.naive)}${badge(r)}</div>`).join("");
    const mb=(lbl,o)=>o.model_mae==null?"":`<span class="badge ${o.model_mae<o.naive_mae?"aok":"abad"}">${lbl} ${o.model_mae.toFixed(2)} / ${o.naive_mae.toFixed(2)}</span>`;
    return`<div class="game${i?" clp":""}">
    <div class="ghead" onclick="this.parentElement.classList.toggle('clp')">
      <span class="px vs">WEEK ${w.week}</span>${mb("PUNTS",w.punts)}${mb("KICKS",w.kicks)}
      <span class="kick"><span class="gchev">&#9662;</span></span></div>
    <div class="gbody">
      ${sect("GAME PUNTS",prow)}
      ${sect("KICKER POINTS",krow)}
    </div></div>`};
  el.innerHTML=howTo("audit")+`
    <div class="astats">
      <div class="astat"><div class="k">WEEKS</div><div class="v">${wks.length}</div><div class="sub">graded vs final stats</div></div>
      ${tile("PUNTS MAE",P)}${tile("KICKS MAE",K)}
    </div>
    <div class="anote">HIT = model closer to the actual than the league-average baseline · ${P.n+K.n} graded rows · week badges = model MAE / naive MAE</div>
    ${wks.map(wkCard).join("")}
    <div class="note" style="text-align:center">audited ${esc((A.generated||"").slice(0,10))} · every slate graded, bet or no bet</div>`;
}

/* ---------- LOG / Supabase ---------- */
async function saveBet(b){
  b.season=SLATE.season;b.week=SLATE.week;
  const r=await fetch(`${SUPA_URL}/rest/v1/b00mstick_bets`,{method:"POST",
    headers:{...SB_HDRS,Prefer:"return=representation"},body:JSON.stringify(b)});
  if(!r.ok){alert("Save failed — are the Supabase tables created?");return}
  await loadBets();show("log");
}
/* fresh book from week 9 (2026-11-06): earlier bets stay in Supabase but
   are hidden from the LOG tab and its stats */
const LOG_SINCE={season:2026,week:9};
async function loadBets(){
  const el=document.getElementById("view-log");
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/b00mstick_bets?select=*&order=created_at.desc`,{headers:SB_HDRS});
    if(!r.ok)throw 0;
    BETS=(await r.json()).filter(b=>b.season>LOG_SINCE.season||
      (b.season===LOG_SINCE.season&&(b.week??0)>=LOG_SINCE.week));
  }catch(e){el.innerHTML=`<div class="err">Bet log unavailable — run the b00mstick SQL in the skyh00k Supabase project.</div>`;return}
  const settled=BETS.filter(b=>b.result!=="PENDING");
  const wl=`${settled.filter(b=>b.result==="WIN").length}-${settled.filter(b=>b.result==="LOSS").length}-${settled.filter(b=>b.result==="PUSH").length}`;
  const clvs=BETS.filter(b=>b.clv_pct!=null).map(b=>+b.clv_pct);
  const avg=clvs.length?(clvs.reduce((a,b)=>a+b,0)/clvs.length).toFixed(2):"—";
  const resSel=b=>`<select onchange="setResult('${b.id}',this.value)">
        ${["PENDING","WIN","LOSS","PUSH"].map(x=>`<option ${x===b.result?"selected":""}>${x}</option>`).join("")}
      </select>`;
  const betCard=b=>{
    /* DRIVE is a 4-way market: there is no single opposite side, so the
       close is all four bucket odds, devigged together (same math as bet
       time). Two-way markets (punts/kicks) keep the your-side/opp pair. */
    const isD=b.market==="DRIVE",key=isD?String(b.selection).split(" 1st drive ")[1]:null;
    // edge at bet time (the chip's number): model minus devigged fair, in prob pts
    const edge=b.model_prob!=null&&b.fair_prob_at_bet!=null?100*(b.model_prob-b.fair_prob_at_bet):null;
    // matchup from the game_id (2026_02_PHI_TEN -> PHI @ TEN)
    const gp=String(b.game_id||"").split("_");
    const mu=gp.length===4?`${tlogo(gp[2],14)}${gp[2]} @ ${tlogo(gp[3],14)}${gp[3]}`:"";
    const close=isD?`
    <div class="closerow c4">
      ${OUTS.map(o=>`<input class="odds" id="c4-${b.id}-${o}" placeholder="cl ${OUT_LBL[o]}" value="${o===key&&b.close_odds!=null?b.close_odds:""}" onchange="setClose4('${b.id}')">`).join("")}
    </div>
    <div class="closerow cbar">
      ${resSel(b)}<span class="small">wk${b.week}</span>
      <button class="logb edtog" onclick="toggleEdit('${b.id}')">EDIT</button>
    </div>`
    :`
    <div class="closerow">
      <input class="odds" placeholder="close (your side)" value="${b.close_odds??""}" onchange="setClose('${b.id}',this,null)">
      <input class="odds" placeholder="close (opp side)" value="${b.opp_close_odds??""}" onchange="setClose('${b.id}',null,this)">
      ${resSel(b)}<span class="small">wk${b.week}</span>
      <button class="logb edtog" onclick="toggleEdit('${b.id}')">EDIT</button>
    </div>`;
    return`
    <div class="bet"><div class="top">
      <b style="letter-spacing:.5px;font-size:11px">${b.market}</b>
      <span class="small">${mu}</span>
      <span>${esc(b.selection)}${b.line!=null?" "+b.line:""}</span>
      <span class="small" title="${b.model_prob!=null?`model ${(100*b.model_prob).toFixed(1)}% vs fair ${(100*b.fair_prob_at_bet).toFixed(1)}% at bet`:""}">@ ${b.your_odds>0?"+":""}${b.your_odds} · ${b.tier}${edge!=null?` ${edge>0?"+":""}${edge.toFixed(1)}`:""}</span>
      <span class="clv ${b.clv_pct>0?"pos":b.clv_pct<0?"neg":""}">${b.clv_pct!=null?(b.clv_pct>0?"+":"")+(+b.clv_pct).toFixed(2):""}</span>
    </div>${close}
    <div class="closerow editrow hidden" id="ed-${b.id}">
      <input class="odds" id="edo-${b.id}" placeholder="your odds" value="${b.your_odds??""}">
      <input class="num" id="edl-${b.id}" placeholder="line (blank = none)" value="${b.line??""}">
      <button class="logb" onclick="saveEdit('${b.id}')">SAVE</button>
      <button class="logb del" onclick="delBet('${b.id}')">DELETE</button>
    </div></div>`;
  };
  el.innerHTML=howTo("log")+`<div class="sumbar">
      <div>BETS<b>${BETS.length}</b></div><div>RECORD<b>${wl}</b></div>
      <div>AVG CLV<b class="${+avg>0?'clv pos':''}">${avg}${clvs.length?" pts":""}</b></div>
      <div>CLV SAMPLE<b>${clvs.length}</b></div></div>
    <div class="note">Fresh book since wk ${LOG_SINCE.week} (earlier bets kept in the DB, just hidden). Enter DK closing odds (your side + opposite side) at kickoff — CLV = devigged close minus devigged bet price, in probability points.</div>
    ${BETS.map(betCard).join("")||'<div class="note">No bets logged yet — price a market and hit LOG.</div>'}`;
  markLogged();
  enhanceSigns(el);
}
/* green-flag every game card that already has a logged bet in that tab's market */
function markLogged(){
  const mk={drive:"DRIVE",punts:"PUNTS",kicks:"KICKS"};
  for(const[tab,m]of Object.entries(mk)){
    const gids=new Set(BETS.filter(b=>b.market===m).map(b=>b.game_id));
    document.querySelectorAll(`#view-${tab} .game`).forEach(c=>
      c.classList.toggle("hasbet",gids.has(c.dataset.gid)));
  }
}
async function setClose(id,mineEl,oppEl){
  const b=BETS.find(x=>x.id===id);
  const mv=mineEl?normOdds(mineEl,true):NaN, ov=oppEl?normOdds(oppEl,true):NaN;
  const close=mineEl?(isNaN(mv)?null:mv):b.close_odds;
  const oc=oppEl?(isNaN(ov)?null:ov):b.opp_close_odds;
  const patch={close_odds:close||null,opp_close_odds:oc||null};
  if(close&&oc){const[fc]=devig2(close,oc);patch.clv_pct=100*(fc-b.fair_prob_at_bet)}
  await fetch(`${SUPA_URL}/rest/v1/b00mstick_bets?id=eq.${id}`,{method:"PATCH",headers:SB_HDRS,body:JSON.stringify(patch)});
  loadBets();
}
async function setClose4(id){
  /* 4-way close for DRIVE bets: store your side's close as soon as it's
     entered; once all four are in, devig the bucket and compute CLV. */
  const b=BETS.find(x=>x.id===id);
  const key=String(b.selection).split(" 1st drive ")[1];
  const vals=OUTS.map(o=>normOdds(document.getElementById(`c4-${id}-${o}`),false));
  const mine=vals[OUTS.indexOf(key)];
  const patch={close_odds:isNaN(mine)?null:mine};
  if(vals.every(v=>!isNaN(v)))
    patch.clv_pct=100*(devigN(vals)[OUTS.indexOf(key)]-b.fair_prob_at_bet);
  await fetch(`${SUPA_URL}/rest/v1/b00mstick_bets?id=eq.${id}`,{method:"PATCH",headers:SB_HDRS,body:JSON.stringify(patch)});
  loadBets();
}
function toggleEdit(id){document.getElementById("ed-"+id).classList.toggle("hidden")}
async function saveEdit(id){
  const b=BETS.find(x=>x.id===id);
  const o=normOdds(document.getElementById("edo-"+id),b.market!=="DRIVE");
  const l=document.getElementById("edl-"+id).value.trim();
  if(isNaN(o))return alert("Odds required (American, e.g. -110).");
  if(l!==""&&isNaN(parseFloat(l)))return alert("Line must be a number, or blank for none.");
  await fetch(`${SUPA_URL}/rest/v1/b00mstick_bets?id=eq.${id}`,{method:"PATCH",headers:SB_HDRS,
    body:JSON.stringify({your_odds:o,line:l===""?null:parseFloat(l)})});
  loadBets();
}
async function delBet(id){
  if(!confirm("Delete this bet permanently? This cannot be undone."))return;
  await fetch(`${SUPA_URL}/rest/v1/b00mstick_bets?id=eq.${id}`,{method:"DELETE",headers:SB_HDRS});
  loadBets();
}
async function setResult(id,val){
  await fetch(`${SUPA_URL}/rest/v1/b00mstick_bets?id=eq.${id}`,{method:"PATCH",headers:SB_HDRS,body:JSON.stringify({result:val})});
  loadBets();
}
